    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- PDF.js Library for Client-side PDF Reading -->

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #f0fdf4 0%, #e0f2fe 100%);
        }
        .header-font {
            font-family: 'Fredoka One', cursive, sans-serif;
        }
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.15);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
        .bounce-active {
            animation: bounce 0.5s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .pulse-orange {
            animation: pulseOrange 2s infinite;
        }
        @keyframes pulseOrange {
            0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

    <!-- Immersive Interactive Audio Engine -->
    <script>
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            play(type) {
                if (!document.getElementById('sound-toggle').checked) return;
                this.init();
                
                const now = this.ctx.currentTime;
                
                if (type === 'correct') {
                    // Ascending chime
                    const osc1 = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();
                    
                    osc1.type = 'triangle';
                    osc2.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    
                    osc1.frequency.setValueAtTime(523.25, now); // C5
                    osc1.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc1.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc1.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                    
                    osc2.frequency.setValueAtTime(1046.50, now);
                    
                    osc1.connect(gainNode);
                    osc2.connect(gainNode);
                    gainNode.connect(this.ctx.destination);
                    
                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.4);
                    osc2.stop(now + 0.4);
                } else if (type === 'wrong') {
                    // Retro flat drop
                    const osc = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();
                    
                    osc.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.12, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    
                    osc.connect(gainNode);
                    gainNode.connect(this.ctx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'milestone') {
                    // Battle transition flourish
                    const osc = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();
                    osc.type = 'sine';
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(440, now + 0.2);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.4);
                    
                    osc.connect(gainNode);
                    gainNode.connect(this.ctx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'purchase') {
                    // Ping noise
                    const osc = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();
                    osc.type = 'sine';
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.frequency.setValueAtTime(987.77, now); // B5
                    osc.connect(gainNode);
                    gainNode.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            }
        };
    </script>

    <script>
        // Core Vocabulary dataset starts empty for a customized student experience
        const defaultVocabulary = [];

        // Configure PDFJS Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // Retrieve local storage if present, otherwise set defaults
        let vocabulary = JSON.parse(localStorage.getItem('vocabquest_db')) || [...defaultVocabulary];
        let pendingParsedWords = []; // Temporarily holding parsed items during user import choice

        const praisePhrases = ["Perfect!", "Excellent!", "Spectacular!", "Unstoppable!", "Godlike!", "Masterful!", "Bravo!"];
        const encouragementPhrases = ["Focus!", "Almost had it!", "Oof! Try again!", "Keep pushing!", "You've got this!"];
        
        let state = {
            phase: 'flashcard', // flashcard, milestone, listening, listening-result, gapfill, report
            currentIndex: 0,
            testStartIndex: 0,
            testEndIndex: 5,
            xp: parseInt(localStorage.getItem('vocabquest_xp')) || 0,
            streak: 0,
            errors: [],
            currentTestIndex: 0,
            listeningScore: 0,
            gapFillAnswered: false,
            currentSentenceObj: null,
            clueUsed: false,
            scrambledHintUsed: false
        };

        let currentUtterance = null;

        // Cache DOM elements
        const contentArea = document.getElementById('content-area');
        const controls = document.getElementById('controls');
        const xpCounter = document.getElementById('xp-counter');
        const xpText = document.getElementById('xp-text');
        const streakCounter = document.getElementById('streak-counter');
        const streakText = document.getElementById('streak-text');
        const rankText = document.getElementById('rank-text');
        const progressBar = document.getElementById('progress-bar');
        const progressIndicator = document.getElementById('progress-indicator');
        const speedSlider = document.getElementById('speech-speed');
        const speedIndicator = document.getElementById('speed-indicator');

        // Activation of scanner trigger
        function triggerFileUpload() {
            document.getElementById('ai-file-upload').click();
        }

        // File handler dispatch
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const scannerModal = document.getElementById('scanner-modal');
            const scannerTitle = document.getElementById('scanner-title');
            const scannerStatus = document.getElementById('scanner-status');
            const scannerProgress = document.getElementById('scanner-progress');
            
            // Show scanning overlay
            scannerModal.classList.remove('hidden');
            setScannerProgress(15, "Reading uploaded resource", "Converting layout components...");

            try {
                if (file.type === "application/pdf") {
                    setScannerProgress(30, "Parsing PDF structure", "Analyzing file pages with local engine...");
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Attempt text content extraction first - slice(0) copies memory to prevent detaching
                    let parsedText = await extractPDFText(arrayBuffer.slice(0));
                    
                    if (parsedText.trim().length > 30) {
                        setScannerProgress(55, "Generating Context with AI", "Formulating structured vocabulary challenges...");
                        await processExtractedText(parsedText);
                    } else {
                        // Fallback: Scanned PDF / Image-Only PDF - slice(0) allows reuse safely
                        setScannerProgress(40, "Image PDF detected", "Rendering page layout to visual canvas...");
                        const base64Image = await renderPDFPageToImage(arrayBuffer.slice(0));
                        setScannerProgress(60, "Scanning visuals with AI", "Dissecting snapshot for target terms...");
                        await processVisualDocument(base64Image, file.type);
                    }
                } else if (file.type.startsWith("image/")) {
                    setScannerProgress(35, "Converting Image layout", "Compressing texture formats for processing...");
                    const base64Image = await convertFileToBase64(file);
                    setScannerProgress(55, "Scanning visual with AI", "Recognizing text patterns via Vision AI...");
                    await processVisualDocument(base64Image, file.type);
                } else {
                    throw new Error("Invalid format. Please supply a PDF or common image (JPG/PNG).");
                }
            } catch (err) {
                console.error(err);
                showToast(err.message || "Unable to parse file. Ensure it is readable.", "error");
            } finally {
                scannerModal.classList.add('hidden');
                event.target.value = ''; // Clean input
            }
        }

        function setScannerProgress(percent, title, status) {
            document.getElementById('scanner-progress').style.width = `${percent}%`;
            document.getElementById('scanner-title').innerText = title;
            document.getElementById('scanner-status').innerText = status;
        }

        // Base64 helper for regular images
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // PDF text-layer parser
        async function extractPDFText(arrayBuffer) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let text = "";
                const pageLimit = Math.min(pdf.numPages, 5); // Read first 5 pages max to protect context windows
                for (let i = 1; i <= pageLimit; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const pageText = content.items.map(item => item.str).join(" ");
                    text += pageText + "\n";
                }
                return text;
            } catch (e) {
                console.warn("PDF text layer extraction failed: ", e);
                return "";
            }
        }

        // Helper to render the first page of a PDF to an image (base64) for visual/OCR processing
        async function renderPDFPageToImage(arrayBuffer) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                if (pdf.numPages === 0) {
                    throw new Error("PDF contains no pages.");
                }
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1.5 });
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                return canvas.toDataURL('image/jpeg', 0.85);
            } catch (err) {
                console.error("renderPDFPageToImage error:", err);
                throw new Error("Failed to visually render the PDF page: " + err.message);
            }
        }

Analyze the provided study text and extract ALL key vocabulary terms present. Do not place an arbitrary limit or cap extraction to a specific number; capture every single vocabulary word found in the document to build a complete, non-restricted study list.
For each selected word, formulate a structured item according to the schema. Output JSON array containing these elements. No conversational filler.`;

${text}

        // Processing Scanned Images/PDF snapshots using Vision capabilities of gemini-3-flash-preview
        async function processVisualDocument(base64DataUrl, mimeType) {
            const base64DataOnly = base64DataUrl.split(',')[1];
            const systemPrompt = `You are an elite English lexicographer and gamification architect.
Analyze this image (textbook, workspace page, study guide, worksheet). Extract ALL key vocabulary terms present. Do not place an arbitrary limit or cap extraction to a specific number; capture every single vocabulary word visible in the image to build a complete, non-restricted study list.

            const userQuery = "Review this document, find the key vocabulary terms, and compile them into structured database questions.";

            const apiKey = ""; // Canvas runtime replaces this if empty
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {

        // Master wrapper for standard JSON schemas
        function getGeminiOutputSchema() {
            return {
                type: "ARRAY",
                description: "Array of extracted vocabulary terms and challenges.",
                items: {

                    properties: {

                            items: {

        // Call Gemini for Text payload
        async function callGeminiParser(systemPrompt, userQuery) {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: getGeminiOutputSchema()
                },
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            await executeGeminiRequest(apiUrl, payload);
        }

        // Actual fetch API engine with exponential backoff handling
        async function executeGeminiRequest(apiUrl, payload) {
            let attempts = 0;
            const maxAttempts = 3;
            let response;

            while (attempts < maxAttempts) {
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) break;
                } catch (e) {
                    // Failures fall through to standard exponential delay
                }
                attempts++;
                if (attempts < maxAttempts) {
                    await new Promise(r => setTimeout(r, Math.pow(2, attempts) * 1000));
                }
            }

            if (!response || !response.ok) {
                throw new Error("Unable to reach AI analyzer. Please check connectivity or try again.");
            }

            const result = await response.json();
            const candidate = result.candidates?.[0];
            const responseText = candidate?.content?.parts?.[0]?.text;

            if (responseText) {
                const cleanWords = JSON.parse(responseText);
                if (Array.isArray(cleanWords) && cleanWords.length > 0) {
                    pendingParsedWords = cleanWords;
                    promptImportChoice(cleanWords);
                } else {
                    throw new Error("No usable terms were found in your document.");
                }
            } else {
                throw new Error("The scanner was unable to formulate exercises from this content.");
            }
        }

        // Applying changes depending on student preference (merge or replace)
        function applyImportChoice(mode) {
            if (pendingParsedWords.length === 0) return;

            if (mode === 'replace') {
                vocabulary = [...pendingParsedWords];
                showToast(`Replaced database with ${pendingParsedWords.length} custom AI-scanned words!`, "success");
            } else {
                // Merge without duplicating existing base words
                const currentWords = vocabulary.map(v => v.word.toLowerCase());
                let addedCount = 0;
                pendingParsedWords.forEach(p => {
                    if (!currentWords.includes(p.word.toLowerCase())) {
                        vocabulary.push(p);
                        addedCount++;
                    }
                });
                showToast(`Merged ${addedCount} new cards into database stack!`, "success");
            }

            localStorage.setItem('vocabquest_db', JSON.stringify(vocabulary));
            document.getElementById('import-choice-modal').classList.add('hidden');

        function updateProgress() {
            const range = Math.max(1, state.testEndIndex - state.testStartIndex);
            let totalSteps = range * 3; // flashcard batch + listening batch + gapfill batch
            let currentStep = 0;
            
            if (state.phase === 'flashcard') {
                currentStep = state.currentIndex - state.testStartIndex;
            } else if (state.phase === 'listening') {
                currentStep = range + (state.currentTestIndex - state.testStartIndex);
            } else if (state.phase === 'gapfill') {
                currentStep = (range * 2) + (state.currentTestIndex - state.testStartIndex);
            } else if (state.phase === 'report' || state.phase === 'listening-result') {
                currentStep = totalSteps;
            }

            const percentage = Math.min(100, Math.max(0, Math.round((currentStep / totalSteps) * 100)));
            progressBar.style.width = `${percentage}%`;
            
            if (percentage > 0) {
                progressIndicator.innerText = `${percentage}%`;
                progressIndicator.classList.remove('scale-0');
            } else {
                progressIndicator.classList.add('scale-0');
            }

        function getHumanVoice() {
            const voices = window.speechSynthesis.getVoices();
            const femaleKeywords = ['female', 'woman', 'samantha', 'victoria', 'zira', 'karen', 'tessa', 'melina', 'ava', 'allison', 'susan'];
            
            let femaleVoice = voices.find(voice => 
                voice.lang.startsWith('en') && 
                femaleKeywords.some(keyword => voice.name.toLowerCase().includes(keyword))
            );
            
            if (femaleVoice) return femaleVoice;

            return voices.find(voice => voice.lang.startsWith('en') && (voice.name.includes('Natural') || voice.name.includes('Premium') || voice.name.includes('Google'))) 
                || voices.find(voice => voice.lang.startsWith('en'));
        }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                currentUtterance = new SpeechSynthesisUtterance(text);
                const voice = getHumanVoice();
                if (voice) currentUtterance.voice = voice;
                currentUtterance.lang = 'en-US';
                currentUtterance.rate = parseFloat(speedSlider.value); 
                window.speechSynthesis.speak(currentUtterance);

                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    contentArea.innerHTML = `
                        <i class="fa-solid fa-crown text-7xl text-yellow-400 mb-4 drop-shadow-xl animate-bounce"></i>
                        <h2 class="text-3xl font-black text-green-600 mb-2">Stage Victory!</h2>
                        <p class="text-slate-500 font-bold mb-4">Spell Accuracy: ${percentage}% (${state.listeningScore}/${total} correct)</p>
                        <p class="text-xs text-slate-400 max-w-sm mb-4">Excellent auditory matching. Now prepare to analyze these vocabulary words in context.</p>
                    `;
                    controls.innerHTML = `
                        <div></div>
                        <button onclick="startGapFill()" class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-black shadow-md flex items-center gap-1.5 active:scale-95 transition-all">
                            Unlock Context Stage <i class="fa-solid fa-lock-open"></i>
                        </button>
                    `;
                } else {
                    contentArea.innerHTML = `
                        <i class="fa-solid fa-skull-crossbones text-7xl text-slate-400 mb-4 drop-shadow-lg"></i>
                        <h2 class="text-3xl font-black text-rose-500 mb-2">Defeated!</h2>
                        <p class="text-slate-500 font-bold mb-4">Accuracy: ${percentage}% (${state.listeningScore}/${total} correct)</p>
                        <p class="text-xs text-slate-400 max-w-sm mb-4">Don't worry, failure is the best teacher. Let's study the syllable layouts one more time.</p>
                    `;
                    controls.innerHTML = `
                        <div></div>
                        <button onclick="retryFlashcards()" class="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-black shadow-md flex items-center gap-1.5 active:scale-95 transition-all">
                            <i class="fa-solid fa-rotate-left"></i> Retry Practice
                        </button>
                    `;
                }
            } 
            
            // Gap Fill / Sentence Context Stage
            else if (state.phase === 'gapfill') {
                state.gapFillAnswered = false;
                const sentenceParts = state.currentSentenceObj.text.split('_____');
                
                contentArea.innerHTML = `
                    <div class="text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">Stage 3 of 3: Sentence Context (${state.currentTestIndex - startIdx + 1} / ${endIdx - startIdx})</div>
                    <div class="w-full max-w-xl text-left bg-white p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-100 flex flex-col gap-4">
                        <div class="flex items-center gap-2 text-violet-700 mb-2">
                            <i class="fa-solid fa-puzzle-piece text-xl"></i>
                            <h3 class="font-black text-lg">Synthesize Context</h3>
                        </div>

                        <div class="bg-violet-50/50 p-5 rounded-2xl border border-violet-100/60 mb-2">
                            <p class="text-lg sm:text-xl leading-relaxed text-slate-700 font-medium flex flex-wrap items-center gap-x-2 gap-y-3">
                                <span>${sentenceParts[0]}</span>
                                <input type="text" id="gap-input" class="w-36 sm:w-44 text-center border-b-4 border-violet-500 bg-violet-50 focus:bg-violet-100 focus:outline-none focus:border-violet-700 text-violet-800 font-black transition-colors rounded-t-lg p-1 text-lg" autocomplete="off" autofocus>
                                <span>${sentenceParts[1] || ''}</span>
                            </p>
                        </div>

                        <!-- Micro XP Clue Store -->
                        <div class="flex items-center justify-between border-t border-slate-100 pt-3">
                            <span class="text-xs text-slate-400 font-bold">Stuck? Buy a context clue.</span>
                            <button onclick="revealContextClue()" id="btn-context-clue" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-100 py-1.5 px-3.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 active:scale-95">
                                <i class="fa-solid fa-eye text-[11px]"></i> Show Clue (5 XP)
                            </button>
                        </div>

                        <div id="dev-analysis" class="hidden bg-slate-50 border-l-4 border-slate-400 p-4 rounded-r-xl transition-all">
                            <p class="font-black text-slate-700 text-xs uppercase tracking-wide flex items-center gap-1">
                                <i class="fa-solid fa-lightbulb text-yellow-500"></i> Hint & Clue
                            </p>
                            <p id="analysis-text" class="text-xs sm:text-sm text-slate-600 mt-1 font-medium leading-relaxed"></p>
                        </div>
                    </div>
                `;
                
                controls.innerHTML = `
                    <div></div>
                    <button id="gap-submit-btn" onclick="checkGapFill()" class="px-6 py-3 bg-violet-600 text-white rounded-xl hover:bg-violet-700 font-extrabold shadow-md active:scale-95 transition-all flex items-center gap-1.5">
                        Lock In <i class="fa-solid fa-lock"></i>
                    </button>
                `;

                const gapInp = document.getElementById('gap-input');
                if (gapInp) {
                    setTimeout(() => gapInp.focus(), 100);
                    gapInp.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') checkGapFill();
                    });
                }
            } 
            
            // Grand Final Report for Current Batch
            else if (state.phase === 'report') {
                confetti({ particleCount: 200, spread: 120, origin: { y: 0.4 } });
                
                const uniqErrors = [...new Set(state.errors)];
                let focusWordsHtml = uniqErrors.length > 0 
                    ? `<div class="mt-4 text-left bg-orange-50 p-5 rounded-2xl w-full max-w-md border-2 border-orange-200">
                        <h3 class="font-black text-orange-800 mb-2 flex items-center gap-1.5 text-sm sm:text-base">
                            <i class="fa-solid fa-crosshairs text-orange-600"></i> Focus Words for Next Match:
                        </h3>
                        <ul class="list-disc pl-5 text-orange-700 font-bold text-xs sm:text-sm space-y-1">
                            ${uniqErrors.map(w => `<li>${w}</li>`).join('')}
                        </ul>
                       </div>`
                    : `<div class="mt-4 text-center bg-teal-50 p-5 rounded-2xl w-full max-w-md border-2 border-teal-200">
                        <p class="font-black text-teal-800 text-base sm:text-lg"><i class="fa-solid fa-medal mr-2 text-2xl text-teal-500 animate-bounce"></i>Flawless Run!</p>
                        <p class="text-teal-600 text-xs font-semibold mt-1">You conquered every spelling and sentence puzzle on the first try!</p>
                       </div>`;

                contentArea.innerHTML = `
                    <div class="mb-4">
                        <i class="fa-solid fa-gift text-7xl text-yellow-500 drop-shadow-xl animate-pulse"></i>
                    </div>
                    <h2 class="text-3xl sm:text-4xl header-font text-slate-800 mb-1">Quest Completed!</h2>
                    <p class="text-slate-500 text-base font-bold mb-4">Total Accumulated Score: <strong class="text-yellow-500 text-2xl sm:text-3xl">${state.xp}</strong> XP</p>
                    ${focusWordsHtml}
                `;
                
                controls.innerHTML = `
                    <button onclick="resetGame()" class="px-4 py-2 bg-slate-200 text-slate-600 rounded-xl hover:bg-slate-300 font-bold transition-all"><i class="fa-solid fa-rotate-left mr-1"></i> Restart All</button>
                    <button onclick="restartBatch()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black shadow-lg hover:shadow-indigo-500/20 active:scale-95 transition-all">
                        Study Next Block <i class="fa-solid fa-forward ml-1"></i>
                    </button>
                `;
            }
        }

        function prevCard() {
            if (state.currentIndex > state.testStartIndex) {
                state.currentIndex--;
                render();
            }
        }

        function nextCard() {
            state.currentIndex++;
            if (state.currentIndex === state.testEndIndex) {
                state.phase = 'milestone';
            } else if (state.currentIndex === vocabulary.length) {
                state.phase = 'report';
            }
            render();
        }

        function startListeningQuiz() {
            state.phase = 'listening';
            state.currentTestIndex = state.testStartIndex;
            state.listeningScore = 0;
            render();
        }

        function playSlowSpeech(word) {
            if (state.xp >= 5) {
                state.xp -= 5;
                xpText.innerText = state.xp;
                localStorage.setItem('vocabquest_xp', state.xp);
                showToast("Deducted 5 XP for slow rate audio", "info");
                AudioFX.play('purchase');
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    currentUtterance = new SpeechSynthesisUtterance(word);
                    const voice = getHumanVoice();
                    if (voice) currentUtterance.voice = voice;
                    currentUtterance.lang = 'en-US';
                    currentUtterance.rate = 0.25; // Super slow turtle mode
                    window.speechSynthesis.speak(currentUtterance);
                }
            } else {
                showToast("Insufficient XP! Earn more points by spelling words.", "error");
            }
        }

        function buyFirstLetterClue() {
            if (state.clueUsed) {
                showToast("First letter hint already revealed!", "info");
                return;
            }
            if (state.xp >= 10) {
                state.xp -= 10;
                xpText.innerText = state.xp;
                localStorage.setItem('vocabquest_xp', state.xp);
                state.clueUsed = true;
                AudioFX.play('purchase');

                const wordObj = vocabulary[state.currentTestIndex];
                const display = document.getElementById('hint-display');
                display.classList.remove('hidden');
                display.innerHTML = `💡 The word starts with: <strong class="text-lg text-indigo-800 uppercase">${wordObj.word.charAt(0)}</strong> (Word length: ${wordObj.word.length} letters)`;
                
                showToast("Deducted 10 XP", "success");
            } else {
                showToast("Not enough XP! Requires 10 XP.", "error");
            }
        }

        // Action key trigger to reveal scrambled anagrams
        function buyScrambledClue() {
            if (state.scrambledHintUsed) {
                showToast("Scramble hint already revealed!", "info");
                return;
            }
            if (state.xp >= 15) {
                state.xp -= 15;
                xpText.innerText = state.xp;
                localStorage.setItem('vocabquest_xp', state.xp);
                state.scrambledHintUsed = true;
                AudioFX.play('purchase');

                const wordObj = vocabulary[state.currentTestIndex];
                // Scramble algorithm
                const arr = wordObj.word.split('');
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                const scrambled = arr.join(' ');
                
                const display = document.getElementById('hint-display');
                display.classList.remove('hidden');
                display.innerHTML = `💡 Scrambled Anagram Hint: <strong class="text-sm tracking-widest text-indigo-800 uppercase">${scrambled}</strong>`;
                
                showToast("Deducted 15 XP", "success");
            } else {
                showToast("Not enough XP! Requires 15 XP.", "error");
            }
        }

        function revealContextClue() {
            if (state.clueUsed) {
                showToast("Clue is already revealed below!", "info");
                return;
            }
            if (state.xp >= 5) {
                state.xp -= 5;
                xpText.innerText = state.xp;
                localStorage.setItem('vocabquest_xp', state.xp);
                state.clueUsed = true;
                AudioFX.play('purchase');

                const analysisBox = document.getElementById('dev-analysis');
                const analysisText = document.getElementById('analysis-text');
                analysisBox.classList.remove('hidden');
                analysisText.innerHTML = `Analysis context clue: <strong class="text-violet-700">"${state.currentSentenceObj.clue}"</strong>`;
                
                showToast("Deducted 5 XP", "success");
            } else {
                showToast("Not enough XP! Requires 5 XP.", "error");
            }
        }

        function checkListening() {
            const btn = document.getElementById('listening-submit-btn');
            if (btn.disabled) return;

            const input = document.getElementById('spell-input');
            const feedback = document.getElementById('feedback-msg');
            const wordObj = vocabulary[state.currentTestIndex];

            const isStrict = document.getElementById('strict-match-toggle').checked;
            
            let userVal = input.value;
            let targetVal = wordObj.word;

            if (!isStrict) {
                userVal = userVal.trim().toLowerCase();
                targetVal = targetVal.trim().toLowerCase();
            }

            btn.disabled = true;

            if (userVal === targetVal) {
                state.listeningScore++;
                input.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                feedback.innerHTML = `<span class="text-green-600"><i class="fa-solid fa-circle-check mr-1 animate-ping"></i> Perfect Alignment!</span>`;
                handleAnswer(true);
                AudioFX.play('correct');
                playFeedbackAudio('correct');
            } else {
                state.errors.push(wordObj.word);
                input.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-700', 'shake');
                feedback.innerHTML = `<span class="text-rose-600"><i class="fa-solid fa-circle-xmark mr-1"></i> Exact Word: <strong class="underline">${wordObj.word}</strong></span>`;
                handleAnswer(false);
                AudioFX.play('wrong');
                playFeedbackAudio('wrong');
            }

            setTimeout(() => {
                state.currentTestIndex++;
                if (state.currentTestIndex < state.testEndIndex) {
                    render();
                } else {
                    state.phase = 'listening-result';
                    render();
                }
            }, 1800);
        }

        function retryFlashcards() {
            state.phase = 'flashcard';
            state.currentIndex = state.testStartIndex;
            render();
        }

        function startGapFill() {
            state.phase = 'gapfill';
            state.currentTestIndex = state.testStartIndex;
            setRandomSentence();
            render();
        }

        function checkGapFill() {
            const input = document.getElementById('gap-input');
            const analysisBox = document.getElementById('dev-analysis');
            const analysisText = document.getElementById('analysis-text');
            const btn = document.getElementById('gap-submit-btn');
            const wordObj = vocabulary[state.currentTestIndex];

            if (state.gapFillAnswered) {
                state.currentTestIndex++;
                if (state.currentTestIndex < state.testEndIndex) {
                    setRandomSentence();
                    render();
                } else {
                    advanceBatch();
                }
                return;
            }

            const isStrict = document.getElementById('strict-match-toggle').checked;
            
            let userVal = input.value;
            let targetVal = wordObj.word;

            if (!isStrict) {
                userVal = userVal.trim().toLowerCase();
                targetVal = targetVal.trim().toLowerCase();
            }

            if (userVal === targetVal) {
                state.gapFillAnswered = true;
                input.disabled = true;
                input.classList.replace('border-violet-500', 'border-green-500');
                input.classList.replace('text-violet-800', 'text-green-700');
                
                btn.innerHTML = `Nailed it! <i class="fa-solid fa-face-smile-beam ml-1.5"></i>`;
                btn.className = "px-6 py-3 bg-green-500 text-white rounded-xl font-black shadow-md transition-all active:scale-95";
                
                handleAnswer(true);
                AudioFX.play('correct');
                playFeedbackAudio('correct');

                setTimeout(() => {
                    state.currentTestIndex++;
                    if (state.currentTestIndex < state.testEndIndex) {
                        setRandomSentence();
                        render();
                    } else {
                        advanceBatch();
                    }
                }, 1600);
            } else {
                state.gapFillAnswered = true;
                input.disabled = true;
                state.errors.push(wordObj.word);
                
                input.classList.add('shake');
                analysisBox.classList.remove('hidden');
                
                handleAnswer(false);
                AudioFX.play('wrong');
                playFeedbackAudio('wrong');

                analysisText.innerHTML = `Clue analysis point: <strong>"${state.currentSentenceObj.clue}"</strong>.<br>The correct term is: <strong class="text-rose-600 select-all">${wordObj.word}</strong>.`;
                
                input.value = wordObj.word;
                input.classList.replace('border-violet-500', 'border-rose-500');
                input.classList.replace('text-violet-800', 'text-rose-700');

                btn.innerHTML = `Continue <i class="fa-solid fa-chevron-right ml-1.5"></i>`;
                btn.className = "px-6 py-3 bg-slate-800 text-white rounded-xl hover:bg-slate-900 font-extrabold shadow-md transition-all active:scale-95";
            }
        }

        function toggleConfigTab() {
            const panel = document.getElementById('config-tab');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                renderWordChips();
            }
        }

        function renderWordChips() {
            const container = document.getElementById('word-chips-container');
            const countEl = document.getElementById('database-count');
            countEl.innerText = vocabulary.length;

            if (vocabulary.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic p-3 w-full text-center">No words in current database stack.</p>`;
                return;
            }

            container.innerHTML = vocabulary.map((vocab, index) => {
                return `
                    <div class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-full px-3 py-1.5 text-xs font-semibold text-slate-700 transition-all">
                        <span class="font-black text-slate-800">${vocab.word}</span>
                        <span class="text-slate-400">(${vocab.meaning})</span>
                        <button type="button" onclick="deleteWord(${index})" class="text-slate-400 hover:text-rose-600 transition-colors p-0.5">
                            <i class="fa-solid fa-times-circle text-sm"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function deleteWord(index) {
            const deletedWord = vocabulary[index].word;
            vocabulary.splice(index, 1);
            localStorage.setItem('vocabquest_db', JSON.stringify(vocabulary));
            renderWordChips();
            showToast(`Deleted "${deletedWord}" from database.`, "error");
            
            // Re-align milestones indices safely
            state.testEndIndex = Math.min(vocabulary.length, 5);
            state.testStartIndex = 0;
            state.currentIndex = 0;
            render();
        }

        function addNewWord(event) {
            event.preventDefault();
            
            const word = document.getElementById('new-word').value.trim();
            const syllables = document.getElementById('new-syllables').value.trim();
            const meaning = document.getElementById('new-meaning').value.trim();
            
            const text1 = document.getElementById('new-sentence-1').value.trim();
            const clue1 = document.getElementById('new-clue-1').value.trim();
            
            const text2 = document.getElementById('new-sentence-2').value.trim();
            const clue2 = document.getElementById('new-clue-2').value.trim();

            if (!text1.includes('_____') || !text2.includes('_____')) {
                showToast("Practice sentences must contain the blank placeholder '_____'", "error");
                return;
            }

            const newEntry = {
                word: word,
                syllables: syllables,
                meaning: meaning,
                sentences: [
                    { text: text1, clue: clue1 },
                    { text: text2, clue: clue2 }
                ]
            };

            vocabulary.push(newEntry);
            localStorage.setItem('vocabquest_db', JSON.stringify(vocabulary));
            
            // Reset form fields
            document.getElementById('add-word-form').reset();
            
            renderWordChips();
            showToast(`Successfully added word "${word}"!`, "success");
            
            // Adjust batch size dynamically
            state.testEndIndex = Math.min(vocabulary.length, state.testStartIndex + 5);
            render();
        }

        function resetToDefaults() {
            vocabulary = [...defaultVocabulary];
            localStorage.setItem('vocabquest_db', JSON.stringify(vocabulary));
            renderWordChips();
            
            state.currentIndex = 0;
            state.testStartIndex = 0;
            state.testEndIndex = Math.min(vocabulary.length, 5);
            state.phase = 'flashcard';
            
            showToast("Restored all vocabulary default settings.", "success");
            render();
        }

        function resetGame() {
            state.currentIndex = 0;
            state.testStartIndex = 0;
            state.testEndIndex = Math.min(vocabulary.length, 5);
            state.errors = [];
            state.phase = 'flashcard';
            render();
        }

        function restartBatch() {
            if (state.testEndIndex < vocabulary.length) {
                advanceBatch();
            } else {
                resetGame();
            }
        }

        // Initialize HUD stats
        xpText.innerText = state.xp;
        updateRank();

        // Start animation loop on window load
        window.onload = function () {
            render();
        }
    </script>
</body>
</html>
