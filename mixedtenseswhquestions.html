    // Sound effects powered by Tone.js (safe fallback if blocked)
    let synth = null;
    function playSound(type) {
      if (!state.soundEnabled) return;
      try {
        if (typeof Tone !== 'undefined') {
          if (Tone.context.state !== 'running') {
            Tone.start();
          }
          if (!synth) {
            synth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: 'triangle' },
              envelope: { attack: 0.01, decay: 0.15, sustain: 0.05, release: 0.2 }
            }).toDestination();
            synth.volume.value = -8;
          }
          const now = Tone.now();
          if (type === 'tap') {
            synth.triggerAttackRelease('C5', '32n', now);
          } else if (type === 'correct') {
            synth.triggerAttackRelease(['C5', 'E5', 'G5'], '16n', now);
          } else if (type === 'wrong') {
            synth.triggerAttackRelease(['E3', 'Eb3'], '16n', now);
          } else if (type === 'victory') {
            synth.triggerAttackRelease('C5', '16n', now);
            synth.triggerAttackRelease('E5', '16n', now + 0.1);
            synth.triggerAttackRelease('G5', '16n', now + 0.2);
            synth.triggerAttackRelease(['C6', 'E6'], '8n', now + 0.32);
          }
        }
      } catch (e) {
        // Ignore audio errors silently
      }
    }

            </div>
          </div>

        <!-- Worlds & Mission Cards -->
        <div class="space-y-8">
          ${worlds.map(w => `
            <section>
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5 px-1">

                  <div class="flex items-center gap-2.5">

    function renderMissionCard(mission) {
      const record = state.completedMissions[mission.id];
      const isTenses = mission.type === 'tenses';
      const modeBadge = isTenses
        ? '<span class="px-2.5 py-1 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">🎯 Multiple Choice Tenses</span>'

        ? '⭐'.repeat(record.stars) + '<span class="opacity-25">' + '⭐'.repeat(3 - record.stars) + '</span>'
        : '<span class="opacity-25">⭐⭐⭐</span>';

      return `

            </div>
          </div>

          <button onclick="startMission('${mission.id}')" class="btn-3d w-full py-3 px-4 rounded-2xl ${record ? 'bg-emerald-600 hover:bg-emerald-700 border-emerald-800' : 'bg-indigo-600 hover:bg-indigo-700 border-indigo-800'} text-white font-display font-semibold text-sm sm:text-base border-b-4 flex items-center justify-center gap-2">
            <span>${record ? 'Play Again' : 'Start Quest'}</span>
            <span>→</span>
          </button>
        </div>
      `;
    }

    /* =========================================================================
       5. MISSION TYPE A: MIXED TENSES & THERE IS/ARE (MULTIPLE CHOICE)
       ========================================================================= */
    function renderTensesMission(mission) {
      const rt = state.missionRuntime;
      const totalQs = Object.keys(mission.questions).length;
      const answeredCount = Object.keys(rt.answeredBlanks).length;
      const progressPct = Math.round((answeredCount / totalQs) * 100);

      const activeQId = rt.selectedBlankId;
      const activeQ = mission.questions[activeQId];
      const activeAnswerState = rt.answeredBlanks[activeQId];

      return `
        <!-- Mission Top Sub-Header -->
        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-sm mb-4">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
            <div class="flex items-center gap-3">
              <button onclick="goHome()" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-colors" title="Back to Map">
                ← Map
              </button>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xl">${mission.icon}</span>
                  <h2 class="font-display font-bold text-lg sm:text-xl text-slate-800">${mission.title}</h2>
                </div>
                <p class="text-xs text-slate-500">${mission.instructions}</p>
              </div>
            </div>

            <div class="flex items-center gap-2 bg-indigo-50 px-3 py-1.5 rounded-2xl border border-indigo-100">
              <span class="text-xs font-bold text-indigo-700">Progress: ${answeredCount}/${totalQs}</span>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600 transition-all duration-300 rounded-full" style="width: ${progressPct}%"></div>
          </div>

          <!-- Quick Jump Number Pills -->
          <div class="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-slate-100">
            ${Object.keys(mission.questions).map(idStr => {
              const id = Number(idStr);
              const ans = rt.answeredBlanks[id];
              const isSelected = id === activeQId;
              let pillClass = 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
              if (ans && ans.isCorrect) {
                pillClass = 'bg-emerald-500 text-white border-emerald-600';
              } else if (isSelected) {
                pillClass = 'bg-indigo-600 text-white border-indigo-700 ring-2 ring-indigo-300';
              }
              return `
                <button onclick="selectTenseBlank(${id})" class="w-8 h-8 rounded-xl text-xs font-bold border transition-all ${pillClass}">
                  ${id}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Dialogue Chat Container -->
        <div class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200 shadow-sm space-y-4 mb-56 sm:mb-48">
          ${mission.dialogue.map(turn => {
            const char = mission.characters[turn.speaker];
            const isRight = char.align === 'right';
            return `
              <div class="flex items-start gap-3 ${isRight ? 'flex-row-reverse' : ''}">
                <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center text-xl shrink-0 shadow-sm">
                  ${char.avatar}
                </div>
                <div class="max-w-[85%] sm:max-w-[78%]">
                  <div class="text-[11px] font-bold text-slate-400 mb-1 ${isRight ? 'text-right' : 'text-left'}">
                    ${char.name}
                  </div>
                  <div class="p-3.5 sm:p-4 rounded-2xl border ${char.bubbleBg} text-sm sm:text-base leading-relaxed text-slate-800 shadow-xs">
                    ${turn.segments.map(seg => {
                      if (seg.text) return `<span>${seg.text}</span>`;
                      if (seg.example) {
                        return `<span class="inline-block px-2.5 py-0.5 mx-0.5 rounded-lg bg-slate-200/80 text-slate-700 font-semibold underline decoration-slate-400" title="Example">${seg.example} <span class="text-[10px] uppercase text-slate-500">(e.g.)</span></span>`;
                      }
                      if (seg.blankId) {
                        const bId = seg.blankId;
                        const qObj = mission.questions[bId];
                        const ansObj = rt.answeredBlanks[bId];
                        const isCurrent = bId === activeQId;

                        if (ansObj && ansObj.isCorrect) {
                          return `
                            <button onclick="selectTenseBlank(${bId})" class="inline-flex items-center gap-1 px-2.5 py-0.5 mx-0.5 my-0.5 rounded-xl bg-emerald-100 border-2 border-emerald-400 text-emerald-900 font-bold text-sm transition-transform hover:scale-105">
                              <span class="text-[10px] bg-emerald-600 text-white px-1.5 rounded-md">${bId}</span>
                              <span>${ansObj.chosen}</span>
                              <span class="text-emerald-600">✓</span>
                            </button>
                          `;
                        }

                        return `
                          <button id="blank-chip-${bId}" onclick="selectTenseBlank(${bId})" class="inline-flex items-center gap-1.5 px-3 py-1 mx-0.5 my-0.5 rounded-xl border-2 font-semibold text-sm transition-all ${isCurrent ? 'bg-indigo-600 text-white border-indigo-700 shadow-md scale-105' : 'bg-amber-50 text-amber-900 border-amber-300 hover:bg-amber-100'}">
                            <span class="text-xs font-bold ${isCurrent ? 'bg-white text-indigo-700' : 'bg-amber-200 text-amber-900'} px-1.5 py-0.2 rounded-md">[${bId}]</span>
                            <span>${qObj.prompt}</span>
                          </button>
                        `;
                      }
                      return '';
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Sticky Bottom Option Deck for Active Blank -->
        <div class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t-2 border-indigo-200 shadow-2xl p-3 sm:p-4">
          <div class="max-w-4xl mx-auto">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-xl bg-indigo-600 text-white font-display font-bold text-xs sm:text-sm">
                  Blank [${activeQId}]
                </span>
                <span class="font-bold text-slate-800 text-sm sm:text-base">
                  Prompt: <span class="text-indigo-700">${activeQ.prompt}</span>
                </span>
              </div>

              <button onclick="toggleTenseTip()" class="px-3 py-1 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-bold flex items-center gap-1 transition-colors">
                <span>💡</span>
                <span>${rt.showTip ? 'Hide Clue' : 'Grammar Clue'}</span>
              </button>
            </div>

            ${rt.showTip ? `
              <div class="mb-2.5 px-3.5 py-2 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs sm:text-sm font-medium animate-pop-in">
                💡 <strong>Clue:</strong> ${activeQ.tip}
              </div>
            ` : ''}

            ${activeAnswerState && activeAnswerState.isCorrect ? `
              <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200 flex flex-wrap items-center justify-between gap-2">
                <div class="text-xs sm:text-sm text-emerald-900 font-medium">
                  ✅ <strong>Correct!</strong> ${activeQ.tip}
                </div>
                ${answeredCount < totalQs ? `
                  <button onclick="jumpToNextUnansweredTense()" class="btn-3d px-4 py-1.5 rounded-xl bg-emerald-600 text-white font-display font-semibold text-xs sm:text-sm border-b-2 border-emerald-800">
                    Next Blank →
                  </button>
                ` : `
                  <button onclick="finishMission('${mission.id}')" class="btn-3d px-4 py-1.5 rounded-xl bg-indigo-600 text-white font-display font-semibold text-xs sm:text-sm border-b-2 border-indigo-800">
                    Finish Quest 🏆
                  </button>
                `}
              </div>
            ` : `
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                ${activeQ.options.map(opt => {
                  const wasWrong = activeAnswerState && activeAnswerState.wrongChoices && activeAnswerState.wrongChoices.includes(opt);
                  return `
                    <button
                      onclick="submitTenseOption(${activeQId}, '${opt.replace(/'/g, "\\'")}')"
                      ${wasWrong ? 'disabled' : ''}
                      class="btn-3d py-3 px-3 rounded-2xl font-semibold text-xs sm:text-sm border-2 border-b-4 transition-all ${
                        wasWrong
                          ? 'bg-rose-50 border-rose-200 text-rose-400 line-through cursor-not-allowed opacity-70'
                          : 'bg-white hover:bg-indigo-50 border-slate-200 hover:border-indigo-400 text-slate-800'
                      }"
                    >
                      ${opt}
                    </button>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function selectTenseBlank(blankId) {
      playSound('tap');
      state.missionRuntime.selectedBlankId = blankId;
      state.missionRuntime.showTip = false;
      render();
      const chip = document.getElementById(`blank-chip-${blankId}`);
      if (chip) {
        chip.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function toggleTenseTip() {
      playSound('tap');
      state.missionRuntime.showTip = !state.missionRuntime.showTip;
      render();
    }

    function jumpToNextUnansweredTense() {
      const mission = MISSIONS.find(m => m.id === state.activeMissionId);
      const ids = Object.keys(mission.questions).map(Number);
      const currentIdx = ids.indexOf(state.missionRuntime.selectedBlankId);
      for (let i = 1; i <= ids.length; i++) {
        const candidateId = ids[(currentIdx + i) % ids.length];
        if (!state.missionRuntime.answeredBlanks[candidateId]?.isCorrect) {
          selectTenseBlank(candidateId);
          return;
        }
      }
    }

    function submitTenseOption(blankId, chosenOption) {
      const mission = MISSIONS.find(m => m.id === state.activeMissionId);
      const question = mission.questions[blankId];
      const existing = state.missionRuntime.answeredBlanks[blankId] || { attempts: 0, wrongChoices: [] };

      if (chosenOption === question.answer) {
        playSound('correct');
        const isFirstTry = existing.attempts === 0;
        state.missionRuntime.answeredBlanks[blankId] = {
          chosen: chosenOption,
          isCorrect: true,
          attempts: existing.attempts + 1,
          firstTry: isFirstTry
        };

        // Gamification rewards
        state.streak += 1;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        const bonus = state.streak >= 3 ? 5 : 0;
        const earned = (isFirstTry ? 10 : 5) + bonus;
        state.xp += earned;
        updateHUD();

        showToast(`+${earned} XP! ${state.streak >= 3 ? `🔥 ${state.streak}x Streak!` : 'Spot on!'}`);

        // Check if all blanks are solved
        const totalQs = Object.keys(mission.questions).length;
        const solvedCount = Object.values(state.missionRuntime.answeredBlanks).filter(a => a.isCorrect).length;

        render();
        if (solvedCount === totalQs) {
          setTimeout(() => finishMission(mission.id), 650);
        } else {
          setTimeout(() => jumpToNextUnansweredTense(), 750);
        }
      } else {
        playSound('wrong');
        state.streak = 0;
        updateHUD();
        existing.attempts += 1;
        if (!existing.wrongChoices.includes(chosenOption)) {
          existing.wrongChoices.push(chosenOption);
        }
        state.missionRuntime.answeredBlanks[blankId] = existing;
        state.missionRuntime.showTip = true;
        showToast('Not quite! Check the grammar clue 💡');
        render();
      }
    }

    /* =========================================================================
       6. MISSION TYPE B: WH-QUESTIONS (WORD ORDERING BUILDER)
       ========================================================================= */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      // Guarantee shuffled order differs from original when length > 1
      if (copy.length > 1 && copy.every((val, idx) => val === arr[idx])) {
        [copy[0], copy[1]] = [copy[1], copy[0]];
      }
      return copy;
    }

    function setupWhQuestion(mission, index) {
      const item = mission.items[index];
      const shuffled = shuffleArray(item.words);
      state.missionRuntime.currentWhIndex = index;
      state.missionRuntime.whBankTiles = shuffled.map((word, idx) => ({
        id: `tile-${index}-${idx}`,
        text: word,
        used: false
      }));
      state.missionRuntime.whPlacedTiles = [];
      state.missionRuntime.whFeedback = null;
      state.missionRuntime.showWhTip = false;
    }

    function renderWhMission(mission) {
      const rt = state.missionRuntime;
      const totalItems = mission.items.length;
      const completedCount = Object.keys(rt.whCompleted).length;
      const progressPct = Math.round((completedCount / totalItems) * 100);
      const currentIdx = rt.currentWhIndex;
      const activeItem = mission.items[currentIdx];

      return `
        <!-- Top Mission Header -->
        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-sm mb-4">

              <button onclick="goHome()" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-colors">
                ← Map
              </button>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xl">${mission.icon}</span>
                  <h2 class="font-display font-bold text-lg sm:text-xl text-slate-800">${mission.title}</h2>
                </div>
                <p class="text-xs text-slate-500">${mission.instructions}</p>
              </div>
            </div>

            <div class="bg-amber-50 px-3 py-1.5 rounded-2xl border border-amber-200 text-xs font-bold text-amber-800">

            </div>
          </div>

          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-300 rounded-full" style="width: ${progressPct}%"></div>
          </div>
        </div>

        <!-- Dialogue History + Active Word-Ordering Stage -->
        <div class="space-y-4 pb-10">
          ${mission.items.slice(0, currentIdx + 1).map((item, idx) => {
            const isDone = Boolean(rt.whCompleted[item.id]);
            const charYou = mission.characters.A;
            const charPartner = mission.characters.B;

            if (isDone) {
              return `
                <!-- Completed Question Bubble -->
                <div class="flex items-start gap-3 flex-row-reverse animate-pop-in">
                  <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center text-xl shrink-0">
                    ${charYou.avatar}
                  </div>
                  <div class="max-w-[85%] sm:max-w-[78%]">
                    <div class="text-[11px] font-bold text-slate-400 mb-1 text-right">${charYou.name}</div>
                    <div class="p-3.5 sm:p-4 rounded-2xl border ${charYou.bubbleBg} text-sm sm:text-base text-slate-800 shadow-xs">
                      <span>${item.leadIn} </span>
                      <span class="font-bold text-emerald-700 underline decoration-emerald-400">${item.words.join(' ')}</span>${item.suffixText || ''}
                      <span class="ml-1.5 text-emerald-600 font-bold">✓</span>
                    </div>
                  </div>
                </div>

                <!-- Partner Reply Bubble -->
                <div class="flex items-start gap-3 animate-pop-in">
                  <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center text-xl shrink-0">
                    ${charPartner.avatar}
                  </div>
                  <div class="max-w-[85%] sm:max-w-[78%]">
                    <div class="text-[11px] font-bold text-slate-400 mb-1">${charPartner.name}</div>
                    <div class="p-3.5 sm:p-4 rounded-2xl border ${charPartner.bubbleBg} text-sm sm:text-base text-slate-800 shadow-xs">
                      ${item.reply}
                    </div>
                  </div>
                </div>
              `;
            }

            // Active Question Builder Card
            const allPlaced = rt.whPlacedTiles.length === item.words.length;
            return `
              <div class="bg-white rounded-3xl p-4 sm:p-6 border-2 border-indigo-300 shadow-lg animate-pop-in">
                <div class="flex items-center justify-between gap-2 mb-3">
                  <span class="px-3 py-1 rounded-xl bg-indigo-600 text-white font-display font-bold text-xs">
                    Question [${item.id}] · Build the Question
                  </span>
                  <button onclick="toggleWhTip()" class="px-3 py-1 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-bold flex items-center gap-1 transition-colors">
                    <span>💡</span>
                    <span>${rt.showWhTip ? 'Hide Clue' : 'Grammar Clue'}</span>
                  </button>
                </div>

                <!-- Context Lead-In & Partner's Answer Clue -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                  <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">${charYou.avatar} ${charYou.name} says:</div>
                    <p class="text-sm text-slate-700 font-medium">"${item.leadIn} <span class="text-indigo-600 font-bold">[ ? ]</span>${item.suffixText || ''}"</p>
                  </div>
                  <div class="p-3.5 rounded-2xl bg-emerald-50/70 border border-emerald-200">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 mb-1">${charPartner.avatar} ${charPartner.name} replies:</div>
                    <p class="text-sm text-slate-800 font-medium">"${item.reply}"</p>
                  </div>
                </div>

                ${rt.showWhTip ? `
                  <div class="mb-4 px-4 py-2.5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 text-xs sm:text-sm font-medium">
                    💡 <strong>Clue:</strong> ${item.tip}
                  </div>
                ` : ''}

                <!-- Answer Construction Tray -->
                <div class="mb-4">
                  <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Your Question Order (Tap a placed word to remove):</div>
                  <div id="wh-tray" class="min-h-[64px] p-3 rounded-2xl bg-indigo-50/60 border-2 border-dashed ${rt.whFeedback?.type === 'error' ? 'border-rose-400 bg-rose-50/50 animate-shake' : 'border-indigo-300'} flex flex-wrap items-center gap-2">
                    ${rt.whPlacedTiles.length === 0
                      ? `<span class="text-xs sm:text-sm text-slate-400 italic px-1">Tap the word tiles below in order to build the question...</span>`
                      : rt.whPlacedTiles.map(tile => `
                          <button onclick="removeWhTile('${tile.id}')" class="btn-3d px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm sm:text-base border-b-4 border-indigo-800 shadow-xs">

                    }
                  </div>
                </div>

                <!-- Feedback Banner -->
                ${rt.whFeedback ? `
                  <div class="mb-4 p-3 rounded-2xl text-xs sm:text-sm font-semibold ${rt.whFeedback.type === 'error' ? 'bg-rose-100 text-rose-800 border border-rose-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}">
                    ${rt.whFeedback.msg}
                  </div>
                ` : ''}

                <!-- Scrambled Word Bank -->
                <div class="mb-5">
                  <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Scrambled Words:</div>
                  <div class="flex flex-wrap gap-2">
                    ${rt.whBankTiles.map(tile => `
                      <button
                        onclick="placeWhTile('${tile.id}')"

                          tile.used
                            ? 'bg-slate-100 border-slate-200 text-slate-300 cursor-default'
                            : 'bg-white hover:bg-amber-50 border-slate-300 hover:border-amber-400 text-slate-800 shadow-xs'
                        }"
                      >
                        ${tile.text}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Action Controls -->
                <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-100">
                  <div class="flex items-center gap-2">
                    <button onclick="clearWhTray()" class="btn-3d px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs sm:text-sm border-b-2 border-slate-300">
                      ↺ Clear
                    </button>
                    <button onclick="hintNextWhWord()" class="btn-3d px-3.5 py-2.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold text-xs sm:text-sm border-b-2 border-amber-300">
                      ✨ Auto-Place Next Word
                    </button>
                  </div>

                  <button
                    onclick="checkWhOrder()"
                    ${!allPlaced ? 'disabled' : ''}
                    class="btn-3d px-6 py-2.5 rounded-2xl font-display font-bold text-sm sm:text-base border-b-4 transition-all ${
                      allPlaced
                        ? 'bg-emerald-600 hover:bg-emerald-700 text-white border-emerald-800 shadow-md'
                        : 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed'
                    }"
                  >
                    Check Order ✓
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function placeWhTile(tileId) {
      playSound('tap');
      const tile = state.missionRuntime.whBankTiles.find(t => t.id === tileId);
      if (!tile || tile.used) return;
      tile.used = true;
      state.missionRuntime.whPlacedTiles.push({ id: tile.id, text: tile.text });
      state.missionRuntime.whFeedback = null;
      render();
    }

    function removeWhTile(tileId) {
      playSound('tap');
      const bankTile = state.missionRuntime.whBankTiles.find(t => t.id === tileId);
      if (bankTile) bankTile.used = false;
      state.missionRuntime.whPlacedTiles = state.missionRuntime.whPlacedTiles.filter(t => t.id !== tileId);
      state.missionRuntime.whFeedback = null;
      render();
    }

    function clearWhTray() {
      playSound('tap');
      state.missionRuntime.whBankTiles.forEach(t => (t.used = false));
      state.missionRuntime.whPlacedTiles = [];
      state.missionRuntime.whFeedback = null;
      render();
    }

    function toggleWhTip() {
      playSound('tap');
      state.missionRuntime.showWhTip = !state.missionRuntime.showWhTip;
      render();
    }

    function hintNextWhWord() {
      playSound('tap');
      const mission = MISSIONS.find(m => m.id === state.activeMissionId);
      const item = mission.items[state.missionRuntime.currentWhIndex];
      const placed = state.missionRuntime.whPlacedTiles;

      // Keep any prefix that is already in the exact right spot
      let validPrefixLen = 0;
      while (validPrefixLen < placed.length && placed[validPrefixLen].text === item.words[validPrefixLen]) {
        validPrefixLen++;
      }

      if (validPrefixLen >= item.words.length) return;

      // Reset all bank tiles, re-apply valid prefix, then place the next required word
      state.missionRuntime.whBankTiles.forEach(t => (t.used = false));
      const newPlaced = [];

      for (let i = 0; i <= validPrefixLen; i++) {
        const neededText = item.words[i];
        const matchTile = state.missionRuntime.whBankTiles.find(t => !t.used && t.text === neededText);
        if (matchTile) {
          matchTile.used = true;
          newPlaced.push({ id: matchTile.id, text: matchTile.text });
        }
      }

      state.missionRuntime.whPlacedTiles = newPlaced;
      state.missionRuntime.whFeedback = null;
      showToast(`Placed "${item.words[validPrefixLen]}" in position ${validPrefixLen + 1}!`);
      render();
    }

    function checkWhOrder() {
      const mission = MISSIONS.find(m => m.id === state.activeMissionId);
      const idx = state.missionRuntime.currentWhIndex;
      const item = mission.items[idx];
      const attemptSentence = state.missionRuntime.whPlacedTiles.map(t => t.text).join(' ');
      const targetSentence = item.words.join(' ');

      const prevRecord = state.missionRuntime.whCompleted[item.id] || { attempts: 0 };

      if (attemptSentence === targetSentence) {
        playSound('correct');
        const isFirstTry = prevRecord.attempts === 0;
        state.missionRuntime.whCompleted[item.id] = {
          attempts: prevRecord.attempts + 1,
          firstTry: isFirstTry
        };

        state.streak += 1;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        const bonus = state.streak >= 3 ? 5 : 0;
        const earned = (isFirstTry ? 15 : 8) + bonus;
        state.xp += earned;
        updateHUD();

        showToast(`+${earned} XP! Great question order!`);

        if (idx + 1 < mission.items.length) {
          setupWhQuestion(mission, idx + 1);
          render();
          setTimeout(() => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          }, 100);
        } else {
          render();
          setTimeout(() => finishMission(mission.id), 650);
        }
      } else {
        playSound('wrong');
        state.streak = 0;
        updateHUD();
        state.missionRuntime.whCompleted[item.id] = { attempts: prevRecord.attempts + 1, firstTry: false };
        delete state.missionRuntime.whCompleted[item.id]; // keep incomplete until solved
        // Store attempt count cleanly on item object
        item._wrongAttempts = (item._wrongAttempts || 0) + 1;
        state.missionRuntime.showWhTip = true;
        state.missionRuntime.whFeedback = {
          type: 'error',
          msg: `Not quite right! Check the question structure: Wh-word + helping verb + subject + main verb. (${item.tip})`
        };
        render();
      }
    }

    /* =========================================================================
       7. MISSION COMPLETION, STARS, BADGES & MODALS
       ========================================================================= */
    function finishMission(missionId) {
      playSound('victory');
      launchConfetti();

      const mission = MISSIONS.find(m => m.id === missionId);
      let total = 0;
      let firstTryCount = 0;

      if (mission.type === 'tenses') {
        const entries = Object.values(state.missionRuntime.answeredBlanks);
        total = Object.keys(mission.questions).length;
        firstTryCount = entries.filter(e => e.firstTry).length;
      } else {
        total = mission.items.length;
        firstTryCount = mission.items.filter(item => !item._wrongAttempts).length;
        // Reset temporary wrong attempt trackers for future replays
        mission.items.forEach(item => { item._wrongAttempts = 0; });
      }

      const accuracy = Math.round((firstTryCount / total) * 100);
      const stars = accuracy >= 85 ? 3 : accuracy >= 60 ? 2 : 1;
      const bonusXp = stars * 25;
      state.xp += bonusXp;

      const prevBest = state.completedMissions[missionId];
      if (!prevBest || accuracy > prevBest.accuracy) {
        state.completedMissions[missionId] = {
          stars,
          accuracy,
          score: `${firstTryCount}/${total}`
        };
      }

      // Unlock mission badge
      let newlyUnlockedBadge = null;
      if (mission.badgeId && !state.unlockedBadges.has(mission.badgeId)) {
        state.unlockedBadges.add(mission.badgeId);
        newlyUnlockedBadge = BADGES.find(b => b.id === mission.badgeId);
      }

      updateHUD();

      // Populate Complete Modal
      document.getElementById('complete-stars').innerHTML =
        '⭐'.repeat(stars) + '<span class="opacity-25">' + '⭐'.repeat(3 - stars) + '</span>';
      document.getElementById('complete-title').textContent =
        stars === 3 ? 'Flawless Mastery!' : stars === 2 ? 'Great Job!' : 'Quest Cleared!';
      document.getElementById('complete-subtitle').textContent = mission.title;
      document.getElementById('complete-score').textContent = `${firstTryCount}/${total}`;
      document.getElementById('complete-accuracy').textContent = `${accuracy}%`;
      document.getElementById('complete-xp').textContent = `+${bonusXp} Bonus`;

      const badgeBox = document.getElementById('complete-badge-unlock');
      if (newlyUnlockedBadge) {
        badgeBox.classList.remove('hidden');
        badgeBox.innerHTML = `🎉 <strong>New Trophy Unlocked:</strong> ${newlyUnlockedBadge.icon} ${newlyUnlockedBadge.title}!`;
      } else {
        badgeBox.classList.add('hidden');
      }

      const modal = document.getElementById('complete-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function retryCurrentMission() {
      const modal = document.getElementById('complete-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      if (state.activeMissionId) {
        startMission(state.activeMissionId);
      }
    }

    function closeCompleteModalAndGoHome() {
      const modal = document.getElementById('complete-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      goHome();
    }

    function openTrophyModal() {
      playSound('tap');
      const grid = document.getElementById('trophy-grid');
      grid.innerHTML = BADGES.map(b => {
        const unlocked = state.unlockedBadges.has(b.id);
        return `
          <div class="p-3.5 rounded-2xl border-2 flex items-center gap-3 ${unlocked ? 'bg-amber-50/70 border-amber-300' : 'bg-slate-50 border-slate-200 opacity-60'}">
            <div class="w-12 h-12 rounded-2xl ${unlocked ? 'bg-amber-100' : 'bg-slate-200 grayscale'} flex items-center justify-center text-2xl shrink-0">
              ${b.icon}
            </div>
            <div>
              <div class="font-display font-bold text-sm text-slate-800 flex items-center gap-1.5">
                <span>${b.title}</span>
                ${unlocked ? '<span class="text-emerald-600 text-xs">✓</span>' : '<span class="text-slate-400 text-xs">🔒</span>'}
              </div>
              <p class="text-xs text-slate-500">${b.desc}</p>
            </div>
          </div>
        `;
      }).join('');

      const modal = document.getElementById('trophy-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeTrophyModal() {
      const modal = document.getElementById('trophy-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    /* =========================================================================
       8. MAIN RENDER LOOP
       ========================================================================= */
    function render() {
      const main = document.getElementById('app-main');
      if (state.view === 'home') {
        main.innerHTML = renderHome();
      } else if (state.view === 'mission') {
        const mission = MISSIONS.find(m => m.id === state.activeMissionId);
        if (!mission) {
          goHome();
          return;
        }
        if (mission.type === 'tenses') {
          main.innerHTML = renderTensesMission(mission);
        } else {
          main.innerHTML = renderWhMission(mission);
        }
      }
    }

    // Initialize app on window load
    window.onload = function () {
      updateHUD();
      render();
    };
  </script>
</body>
</html>
